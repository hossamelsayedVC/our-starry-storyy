<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080e29"><title>Our Starry Story ✨</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Tajawal:wght@400;500;700&display=swap');
:root{--gold:#f7d794;--cream:#fff2d9}*{box-sizing:border-box}html,body{margin:0;background:#060d28;color:var(--cream);font-family:Tajawal,sans-serif;overflow:hidden}button{font:inherit;cursor:pointer}#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 15%,#020619d9 100%);z-index:1}.scene{position:relative;z-index:2;height:100dvh;display:grid;place-items:center;padding:15px;perspective:1200px}.intro,.chapter,.ending{width:min(100%,950px);text-align:center;transition:opacity .75s,transform .85s;transform-style:preserve-3d}.hidden{display:none!important}h1,h2{font-family:'Cormorant Garamond',Tajawal,serif;font-weight:500;text-shadow:0 5px 25px #0008}h1{font-size:clamp(3rem,8vw,6rem);margin:0}h2{font-size:clamp(2.4rem,7vw,4.7rem);margin:10px 0}.eyebrow{color:var(--gold);letter-spacing:.19em;font-size:.75rem}.subtitle,.description{font-size:clamp(1.15rem,2.5vw,1.55rem);line-height:1.7}.subtitle{font-family:'Cormorant Garamond',Tajawal,serif}.portal-wrap{height:clamp(245px,42vh,385px);display:grid;place-items:center;margin:18px auto;perspective:1100px}.portal{position:relative;width:clamp(160px,22vw,235px);height:100%;border:10px solid #b78b4b;border-radius:115px 115px 8px 8px;box-shadow:0 0 0 3px #f7dba1,0 0 50px #f9c86e66,inset 0 0 30px #f8c66d88;transform-style:preserve-3d;background:radial-gradient(ellipse at center,#ffd78388,#1b3277 56%,#081332 85%)}.portal:before{content:'';position:absolute;inset:-18px;border:2px solid #e6bb70;border-radius:130px 130px 12px 12px;opacity:.5}.door{position:absolute;inset:0;transform-origin:left center;border-radius:105px 105px 2px 2px;background:repeating-linear-gradient(90deg,#573b31 0px,#78513c 13px,#3d2c2e 24px);border:3px solid #d3a968;box-shadow:inset 0 0 0 10px #3d2927,inset 0 0 0 12px #c79c63,0 8px 20px #0009;transition:transform 1.8s cubic-bezier(.2,.75,.1,1)}.door:after{content:'';position:absolute;right:16px;top:55%;width:11px;height:11px;border-radius:50%;background:#ffe2a2;box-shadow:0 0 12px #ffe0a0}.portal.open .door{transform:rotateY(-110deg)}.portal-glow{position:absolute;inset:10%;border-radius:50%;background:#ffdd9466;filter:blur(28px);animation:pulse 3s infinite alternate}.primary,.secondary{border:1px solid #edcb85;background:linear-gradient(135deg,#f4db9c,#b88a47);color:#17203a;padding:13px 27px;border-radius:50px;font-weight:700;box-shadow:0 5px 30px #f4ca6e33;transition:transform .3s,box-shadow .3s}.secondary{background:#081739bb;color:var(--gold);box-shadow:none}.primary:hover,.secondary:hover{transform:translateY(-4px);box-shadow:0 7px 30px #f4ca6e66}.primary:disabled,.secondary:disabled{opacity:.3;cursor:not-allowed}.chapter{max-height:94dvh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#b99160 transparent;padding:18px 12px 24px;animation:arrive 1s both}.date{color:var(--gold);letter-spacing:.13em;margin-top:12px}.description{white-space:pre-line;max-width:720px;margin:15px auto 23px}.gallery{display:flex;justify-content:center;flex-wrap:wrap;align-items:center;gap:19px;margin:15px auto 30px;perspective:1000px}.photo{width:clamp(140px,23vw,220px);height:clamp(170px,28vw,270px);padding:9px 9px 26px;border:0;background:#f5e9ce;box-shadow:0 16px 45px #000a;transform:rotate(var(--tilt)) translateZ(var(--depth));transition:transform .4s;cursor:zoom-in}.photo:hover{transform:rotate(0) translateY(-13px) scale(1.05)}.photo img{width:100%;height:100%;object-fit:cover}.photo.missing{display:grid;place-items:center;color:#485075}.navigation{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}.counter{color:var(--gold);font-size:.82rem}.fade-out{opacity:0;transform:translateZ(-480px) rotateY(13deg) scale(.7);pointer-events:none}.fade-in{animation:arrive .95s both}.ending p{font-size:1.5rem}.lightbox{position:fixed;inset:0;z-index:30;background:#030613f5;display:grid;grid-template-columns:55px 1fr 55px;place-items:center;padding:15px;animation:lightIn .35s both}.lightbox figure{margin:0;min-width:0;text-align:center}.lightbox img{display:block;max-width:100%;max-height:78dvh;object-fit:contain;margin:auto;box-shadow:0 0 65px #f1c77d33;animation:photoIn .38s both}.lightbox figcaption{color:var(--gold);margin-top:13px}.lightbox button{border:1px solid #f7d79466;background:#10204dbb;color:#fff3d6;border-radius:50%;width:44px;height:44px;font-size:1.5rem}.lightbox button:disabled{opacity:.25}.lightbox .close{position:absolute;top:18px;right:18px}.lightbox .left{grid-column:1}.lightbox figure{grid-column:2;grid-row:1}.lightbox .right{grid-column:3;grid-row:1}.lightbox .left{grid-row:1}.sound{position:fixed;z-index:5;top:18px;left:18px;border:1px solid #f7d79477;border-radius:30px;background:#07132dca;color:var(--gold);padding:10px 14px}.hint{opacity:.65;font-size:.8rem;margin-top:16px}@keyframes pulse{to{opacity:.3;transform:scale(1.2)}}@keyframes arrive{from{opacity:0;transform:translateZ(-550px) rotateY(-12deg) scale(.7)}to{opacity:1;transform:translateZ(0) rotateY(0) scale(1)}}@keyframes lightIn{from{opacity:0}to{opacity:1}}@keyframes photoIn{from{opacity:0;transform:scale(.86) rotateY(12deg)}to{opacity:1;transform:scale(1) rotateY(0)}}@media(max-width:600px){.scene{padding:8px}.portal-wrap{height:33vh}.photo{width:38vw;height:46vw;padding:6px 6px 18px}.gallery{gap:10px}.lightbox{grid-template-columns:40px 1fr 40px;padding:8px}.lightbox button{width:35px;height:35px}.navigation{gap:7px}.primary,.secondary{padding:11px 15px;font-size:.82rem}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><canvas id="sky" aria-hidden="true"></canvas><div class="vignette"></div><button id="sound" class="sound hidden" aria-label="التحكم في الموسيقى">♫ إيقاف الموسيقى</button><audio id="music" src="audio/our-song.mp3" preload="auto" loop></audio><main class="scene"><section id="intro" class="intro"><div class="eyebrow">A journey written in the stars</div><h1 id="portalTitle"></h1><div class="subtitle" id="portalSubtitle"></div><div class="portal-wrap"><div class="portal" id="portal"><div class="portal-glow"></div><div class="door"></div></div></div><button id="openBtn" class="primary"></button><div class="hint">Made with love, under the same stars</div></section><section id="chapter" class="chapter hidden" aria-live="polite"><div class="eyebrow" id="chapterLabel"></div><div class="date" id="memoryDate"></div><h2 id="memoryTitle"></h2><p id="memoryText" class="description"></p><div id="gallery" class="gallery"></div><div class="navigation"><button id="prevBtn" class="secondary">→ السابق</button><span id="counter" class="counter"></span><button id="nextBtn" class="primary">التالي ←</button></div></section><section id="ending" class="ending hidden"><div class="eyebrow">To be continued...</div><h2 id="endTitle"></h2><p id="endText"></p><button id="restartBtn" class="primary">✦ من البداية ✦</button></section></main><div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="معرض الصور"><button class="close" id="closePhoto" aria-label="إغلاق">×</button><button class="left" id="prevPhoto" aria-label="الصورة السابقة">❮</button><figure><img id="largeImage" alt="صورة من الذكرى"><figcaption id="photoCounter"></figcaption></figure><button class="right" id="nextPhoto" aria-label="الصورة التالية">❯</button></div><script src="content.js"></script><script>
const $=id=>document.getElementById(id);
$('portalTitle').textContent=STORY.portalTitle;$('portalSubtitle').textContent=STORY.portalSubtitle;$('openBtn').textContent=STORY.portalButton;$('endTitle').textContent=STORY.endingTitle;$('endText').textContent=STORY.endingText;
const pages=STORY.pages;let index=0,busy=false,photoIndex=0,activePhotos=[],previousFocus=null;const music=$('music');
$('sound').onclick=()=>{if(music.paused){music.play().then(()=>{$('sound').textContent='♫ إيقاف الموسيقى'}).catch(()=>{})}else{music.pause();$('sound').textContent='♫ تشغيل الموسيقى'}};
function render(i){index=i;const p=pages[i];$('chapterLabel').textContent=p.type==='intro'?`A little before our story · ${i+1} / 2`:`Memory ${String(i-1).padStart(2,'0')} · written in the stars`;$('memoryDate').textContent=p.type==='memory'?(p.date||''):'';$('memoryDate').style.display=p.type==='memory'?'block':'none';$('memoryTitle').textContent=p.title;$('memoryText').textContent=p.text;$('counter').textContent=`${i+1} / ${pages.length}`;$('prevBtn').disabled=i===0;$('nextBtn').textContent=i===pages.length-1?'Our Forever ✨':'التالي ←';const gallery=$('gallery');gallery.replaceChildren();(p.photos||[]).forEach((src,j)=>{const btn=document.createElement('button');btn.className='photo';btn.style.setProperty('--tilt',[-7,5,-3,8][j%4]+'deg');btn.style.setProperty('--depth',(j%3*12)+'px');const img=document.createElement('img');img.src=src;img.alt=`${p.title} — ${j+1}`;img.loading='lazy';img.onerror=()=>{btn.classList.add('missing');btn.textContent='الصورة غير موجودة'};btn.append(img);btn.onclick=()=>openPhoto(j);gallery.append(btn)});}
function animateChange(next){if(busy)return;busy=true;const el=$('chapter');el.classList.add('fade-out');setTimeout(()=>{render(next);el.scrollTop=0;el.classList.remove('fade-out');el.classList.add('fade-in');setTimeout(()=>{el.classList.remove('fade-in');busy=false},950)},700)}
function transition(from,to,callback){if(busy)return;busy=true;from.classList.add('fade-out');setTimeout(()=>{from.classList.add('hidden');from.classList.remove('fade-out');callback?.();to.classList.remove('hidden');to.classList.add('fade-in');setTimeout(()=>{to.classList.remove('fade-in');busy=false},950)},700)}
$('openBtn').onclick=()=>{if(busy)return;music.play().then(()=>{$('sound').textContent='♫ إيقاف الموسيقى'}).catch(()=>{$('sound').textContent='♫ تشغيل الموسيقى'});$('sound').classList.remove('hidden');$('portal').classList.add('open');busy=true;setTimeout(()=>{busy=false;transition($('intro'),$('chapter'),()=>render(0))},1150)};
$('nextBtn').onclick=()=>{if(index===pages.length-1){transition($('chapter'),$('ending'));return}animateChange(index+1)};
$('prevBtn').onclick=()=>{if(index>0)animateChange(index-1)};
$('restartBtn').onclick=()=>{transition($('ending'),$('intro'),()=>{$('portal').classList.remove('open')})};
function openPhoto(i){activePhotos=pages[index].photos||[];if(!activePhotos.length)return;previousFocus=document.activeElement;photoIndex=i;$('lightbox').classList.remove('hidden');updatePhoto();$('closePhoto').focus()}
function updatePhoto(){const img=$('largeImage');img.style.animation='none';void img.offsetWidth;img.style.animation='';img.src=activePhotos[photoIndex];$('photoCounter').textContent=`${photoIndex+1} / ${activePhotos.length}`;$('prevPhoto').disabled=activePhotos.length<2;$('nextPhoto').disabled=activePhotos.length<2}
function stepPhoto(n){photoIndex=(photoIndex+n+activePhotos.length)%activePhotos.length;updatePhoto()}
function closePhoto(){$('lightbox').classList.add('hidden');previousFocus?.focus()}
$('closePhoto').onclick=closePhoto;$('prevPhoto').onclick=()=>stepPhoto(-1);$('nextPhoto').onclick=()=>stepPhoto(1);
$('lightbox').onclick=e=>{if(e.target===$('lightbox'))closePhoto()};
document.addEventListener('keydown',e=>{if(!$('lightbox').classList.contains('hidden')){if(e.key==='Escape')closePhoto();if(e.key==='ArrowRight')stepPhoto(-1);if(e.key==='ArrowLeft')stepPhoto(1);if(e.key==='Tab'){const controls=[$('closePhoto'),$('prevPhoto'),$('nextPhoto')].filter(x=>!x.disabled);const at=controls.indexOf(document.activeElement);if(e.shiftKey&&at===0){e.preventDefault();controls[controls.length-1].focus()}else if(!e.shiftKey&&at===controls.length-1){e.preventDefault();controls[0].focus()}}return}if(!$('chapter').classList.contains('hidden')){if(e.key==='ArrowLeft')$('nextBtn').click();if(e.key==='ArrowRight')$('prevBtn').click()}});
// Animated painterly night sky: swirling bands, glowing stars and drifting particles.
const canvas=$('sky'),ctx=canvas.getContext('2d');let w,h,dpr,stars=[],particles=[];function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(155,Math.round(w*h/6500))},()=>({x:Math.random()*w,y:Math.random()*h,r:.6+Math.random()*2.1,p:Math.random()*6.28,s:.4+Math.random()*.9}));particles=Array.from({length:75},()=>({x:Math.random()*w,y:Math.random()*h,r:15+Math.random()*45,p:Math.random()*6.28}))}addEventListener('resize',resize);resize();let frame=0;function draw(){frame++;const t=frame*.006;const bg=ctx.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#06102c');bg.addColorStop(.45,'#143267');bg.addColorStop(1,'#090f2e');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);ctx.save();ctx.globalCompositeOperation='screen';for(let b=0;b<7;b++){const cx=w*(.12+b*.14),cy=h*(.22+Math.sin(b*1.8+t*.16)*.13);for(let k=0;k<5;k++){ctx.beginPath();ctx.ellipse(cx,cy,130+k*34,20+k*10,-.3+Math.sin(t*.15+b)*.22,0,Math.PI*1.55);ctx.strokeStyle=k%2?`rgba(65,118,177,${.045-k*.006})`:`rgba(221,164,78,${.04-k*.005})`;ctx.lineWidth=9+k*3;ctx.stroke()}}ctx.restore();particles.forEach(p=>{let x=(p.x+Math.sin(t*.25+p.p)*20),y=p.y+Math.cos(t*.2+p.p)*12;ctx.beginPath();ctx.arc(x,y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(38,94,165,.015)';ctx.fill()});stars.forEach(s=>{const tw=.6+.4*Math.sin(t*s.s+s.p),r=s.r*tw;ctx.beginPath();ctx.arc(s.x,s.y,r,0,Math.PI*2);ctx.fillStyle=`rgba(255,227,164,${.45+tw*.5})`;ctx.shadowColor='#ffdb91';ctx.shadowBlur=r*8;ctx.fill();ctx.shadowBlur=0;if(s.r>2.1){ctx.strokeStyle=`rgba(255,220,155,${tw*.35})`;ctx.beginPath();ctx.moveTo(s.x-r*3,s.y);ctx.lineTo(s.x+r*3,s.y);ctx.moveTo(s.x,s.y-r*3);ctx.lineTo(s.x,s.y+r*3);ctx.stroke()}});requestAnimationFrame(draw)}draw();
</script></body></html>
